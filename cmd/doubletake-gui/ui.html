<!doctype html>
<html lang="__DOUBLETAKE_LOCALE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DoubleTake</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f8ff;
      --muted: #8fa5c4;
      --dim: #58708f;
      --line: rgba(123, 166, 225, .13);
      --panel: rgba(10, 18, 33, .78);
      --panel-solid: #0c1627;
      --blue: #3d8dff;
      --blue-2: #67b2ff;
      --cyan: #61e6ff;
      --danger: #ff5c7a;
      --shadow: 0 22px 70px rgba(0, 0, 0, .38);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -10%, rgba(35, 110, 230, .24), transparent 39%),
        radial-gradient(circle at 100% 100%, rgba(43, 188, 232, .10), transparent 36%),
        #050a12;
      user-select: none;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { height: 100%; display: flex; flex-direction: column; }
    .topbar {
      height: 76px; flex: 0 0 76px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 10, 18, .72); backdrop-filter: blur(24px);
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark { width: 46px; height: 46px; display: grid; place-items: center; filter: drop-shadow(0 9px 17px rgba(38, 124, 255, .28)); }
    .mark img { width: 48px; height: 48px; object-fit: contain; }
    .brand-name { font-size: 19px; font-weight: 720; letter-spacing: -.025em; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .service-pill {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border: 1px solid var(--line); background: rgba(12, 25, 44, .62); border-radius: 999px;
      color: var(--muted); font-size: 12px;
    }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #54dca2; box-shadow: 0 0 0 5px rgba(84,220,162,.08); }
    .layout { min-height: 0; flex: 1; display: grid; grid-template-columns: 365px minmax(0, 1fr); }
    .sidebar {
      min-height: 0; padding: 25px 20px 18px 24px; display: flex; flex-direction: column;
      border-right: 1px solid var(--line); background: rgba(5, 11, 20, .48);
    }
    .section-kicker { color: var(--blue-2); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .section-title { margin: 7px 0 18px; font-size: 22px; font-weight: 680; letter-spacing: -.035em; }
    .search-wrap { position: relative; margin-bottom: 15px; }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; width: 17px; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
    .search {
      width: 100%; height: 45px; padding: 0 42px 0 42px; color: var(--ink);
      outline: none; border: 1px solid var(--line); border-radius: 14px;
      background: rgba(17, 29, 48, .7); transition: .2s ease;
    }
    .search::placeholder { color: #617491; }
    .search:focus { border-color: rgba(73, 148, 255, .62); box-shadow: 0 0 0 4px rgba(61,141,255,.09); background: rgba(18,34,58,.92); }
    .clear-search { position: absolute; right: 8px; top: 8px; width: 29px; height: 29px; border: 0; border-radius: 9px; background: transparent; color: var(--dim); cursor: pointer; display: none; }
    .clear-search:hover { background: rgba(255,255,255,.06); color: var(--ink); }
    .list-head { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 10px; color: var(--muted); font-size: 11px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .device-list { min-height: 0; overflow-y: auto; padding: 2px 5px 10px 0; scrollbar-width: thin; scrollbar-color: #223a5a transparent; }
    .device-list::-webkit-scrollbar { width: 7px; }
    .device-list::-webkit-scrollbar-thumb { background: #203a5e; border-radius: 99px; }
    .device {
      width: 100%; margin-bottom: 9px; padding: 14px; text-align: left; cursor: pointer;
      display: grid; grid-template-columns: 43px minmax(0,1fr) auto; gap: 12px; align-items: center;
      border: 1px solid var(--line); border-radius: 16px; background: rgba(12, 23, 40, .66);
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .device:hover { transform: translateY(-1px); border-color: rgba(76,150,255,.42); background: rgba(17,34,59,.9); box-shadow: 0 12px 30px rgba(0,0,0,.16); }
    .device.active { border-color: rgba(76,150,255,.35); background: linear-gradient(135deg, rgba(25,60,111,.62), rgba(11,27,49,.8)); }
    .device:disabled { cursor: default; opacity: .82; transform: none; }
    .tv-icon { width: 43px; height: 43px; border-radius: 13px; display: grid; place-items: center; background: rgba(49,115,219,.13); color: var(--blue-2); border: 1px solid rgba(88,154,255,.12); }
    .tv-icon svg { width: 23px; }
    .device-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 640; letter-spacing: -.01em; }
    .device-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .chevron { width: 18px; color: #526986; }
    .connected-dot { width: 8px; height: 8px; border-radius: 50%; background: #5bdeae; box-shadow: 0 0 0 5px rgba(91,222,174,.08); }
    .empty-list { padding: 36px 18px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .radar { width: 55px; height: 55px; margin: 0 auto 16px; border: 1px solid rgba(78,151,255,.25); border-radius: 50%; position: relative; animation: breathe 3s ease-in-out infinite; }
    .radar::before, .radar::after { content:""; position:absolute; inset:10px; border:1px solid rgba(78,151,255,.18); border-radius:50%; }
    .radar::after { inset: 25px; background: var(--blue); border: 0; box-shadow: 0 0 18px var(--blue); }
    .main { min-width: 0; min-height: 0; overflow-y: auto; padding: 32px; }
    .main::-webkit-scrollbar { width: 7px; }
    .main::-webkit-scrollbar-thumb { background: #203a5e; border-radius: 99px; }
    .welcome { min-height: 100%; display: grid; place-items: center; }
    .welcome-inner { max-width: 560px; text-align: center; padding-bottom: 28px; }
    .orb { width: 132px; height: 132px; margin: 0 auto 18px; position: relative; display: grid; place-items: center; animation: breathe 3s ease-in-out infinite; }
    .orb::before { content:""; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 40% 35%, rgba(78,164,255,.38), rgba(27,75,151,.10) 53%, transparent 70%); filter:blur(2px); }
    .orb::after { content:""; position:absolute; inset:18px; border:1px solid rgba(95,176,255,.2); border-radius:38px; transform:rotate(45deg); background:rgba(19,44,81,.22); }
    .orb svg { width: 55px; z-index:1; color:#7fc4ff; filter:drop-shadow(0 6px 20px rgba(62,151,255,.4)); }
    @keyframes breathe { 0%, 100% { transform:scale(1); opacity:.8; } 50% { transform:scale(1.07); opacity:1; } }
    .shortcut { display: inline-flex; gap: 7px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; color: var(--muted); font-size: 11px; background:rgba(9,19,34,.55); }
    kbd { min-width: 25px; padding: 3px 7px; color: #cfe5ff; border: 1px solid rgba(123,166,225,.21); border-bottom-color: rgba(123,166,225,.38); border-radius: 6px; background: #101f34; font: 600 10px inherit; }
    .sessions-head { display:flex; align-items:flex-end; justify-content:space-between; margin: 1px 0 19px; }
    .sessions-head h1 { margin: 5px 0 0; font-size: 28px; letter-spacing: -.045em; }
    .live-pill { display:flex; align-items:center; gap:8px; color:#8eb1da; font-size:12px; }
    .session-card { position:relative; overflow:hidden; margin-bottom: 18px; padding: 25px; border: 1px solid rgba(91,151,229,.18); border-radius: 24px; background: linear-gradient(145deg, rgba(15,31,54,.92), rgba(8,18,32,.92)); box-shadow: var(--shadow); }
    .session-card::before { content:""; position:absolute; width:240px; height:240px; right:-100px; top:-140px; border-radius:50%; background:rgba(51,130,255,.14); filter:blur(30px); }
    .session-top { position:relative; display:flex; align-items:center; gap:15px; }
    .session-icon { width:54px; height:54px; flex:0 0 auto; border-radius:17px; display:grid; place-items:center; color:#84c6ff; border:1px solid rgba(99,169,255,.2); background:linear-gradient(145deg,rgba(40,104,205,.25),rgba(24,54,99,.15)); }
    .session-icon svg { width:28px; }
    .session-info { min-width:0; flex:1; }
    .session-name { font-size:19px; font-weight:680; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.025em; }
    .session-detail { margin-top:5px; color:var(--muted); font-size:12px; }
    .state-chip { display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid rgba(84,220,162,.16); border-radius:999px; color:#7de0ba; background:rgba(32,112,85,.10); font-size:11px; }
    .state-chip.connecting { color:#82bbff; border-color:rgba(82,153,255,.19); background:rgba(38,95,184,.10); }
    .state-chip.frozen { color:#94dfff; border-color:rgba(97,230,255,.20); background:rgba(30,128,153,.11); }
    .spinner { width:9px; height:9px; border:1.5px solid rgba(130,187,255,.25); border-top-color:#82bbff; border-radius:50%; animation:spin .8s linear infinite; will-change:transform; }
    .metrics { position:relative; display:flex; gap:9px; flex-wrap:wrap; margin:21px 0 23px; }
    .metric { padding:8px 11px; border:1px solid var(--line); background:rgba(3,11,21,.34); border-radius:10px; color:var(--muted); font-size:11px; }
    .metric strong { color:#cbdcf2; font-weight:600; }
    .audio-panel { position:relative; display:flex; align-items:center; gap:14px; margin:-5px 0 19px; padding:12px 14px; border:1px solid rgba(87,151,235,.18); border-radius:14px; background:rgba(7,18,34,.55); }
    .audio-toggle { height:37px; min-width:91px; padding:0 10px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid rgba(112,174,255,.2); border-radius:11px; background:rgba(45,112,204,.12); color:#9accff; cursor:pointer; font-size:12px; font-weight:650; }
    .audio-toggle:hover { background:rgba(45,112,204,.23); }
    .audio-toggle svg { width:19px; }
    .audio-range-wrap { min-width:0; flex:1; }
    .audio-range-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; font-size:11px; color:#b6cce8; }
    .audio-range-head strong { color:#e2efff; font-size:12px; font-variant-numeric:tabular-nums; }
    .audio-range { width:100%; height:5px; margin:0; accent-color:#58a6ff; cursor:pointer; }
    .audio-panel button:disabled, .audio-range:disabled { opacity:.5; cursor:default; }
    .controls { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    .btn { height:48px; border-radius:14px; border:1px solid transparent; cursor:pointer; font-weight:650; font-size:13px; display:flex; align-items:center; justify-content:center; gap:9px; transition:.17s ease; }
    .btn svg { width:18px; }
    .btn:disabled { cursor:default; opacity:.5; }
    .btn-primary { background:linear-gradient(135deg,#276fe5,#3da8ff); box-shadow:0 10px 25px rgba(32,111,225,.25), inset 0 1px rgba(255,255,255,.19); }
    .btn-primary:hover:not(:disabled) { transform:translateY(-1px); filter:brightness(1.08); }
    .btn-primary.armed { background:linear-gradient(135deg,#167794,#27b4d2); animation:armedPulse 1.25s ease-in-out infinite; }
    @keyframes armedPulse { 50% { box-shadow:0 0 0 7px rgba(67,203,236,.07),0 10px 25px rgba(18,141,173,.26); } }
    .btn-secondary { border-color:rgba(255,92,122,.18); background:rgba(98,25,43,.12); color:#ff91a6; }
    .btn-secondary:hover:not(:disabled) { background:rgba(135,31,57,.23); border-color:rgba(255,92,122,.32); }
    .freeze-banner { margin:0 0 16px; padding:13px 16px; display:flex; align-items:center; gap:12px; border:1px solid rgba(97,230,255,.18); border-radius:14px; background:rgba(25,113,139,.10); color:#a5e9f7; font-size:12px; }
    .freeze-banner kbd { margin-left:auto; }
    .system-error { margin-bottom:17px; padding:14px 16px; border:1px solid rgba(255,92,122,.22); border-radius:14px; background:rgba(108,26,46,.13); color:#ff9eb0; font-size:12px; line-height:1.5; }
    .modal-backdrop { position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:22px; background:rgba(2,6,12,.7); backdrop-filter:blur(14px); }
    .modal-backdrop.open { display:grid; animation:fadeIn .15s ease; }
    @keyframes fadeIn { from { opacity:0; } }
    .modal { width:min(430px,100%); padding:26px; border:1px solid rgba(103,163,239,.20); border-radius:24px; background:linear-gradient(155deg,#111f34,#091421); box-shadow:0 34px 90px rgba(0,0,0,.55); animation:modalIn .18s ease; }
    @keyframes modalIn { from { opacity:0; transform:translateY(8px) scale(.985); } }
    .modal-icon { width:45px; height:45px; border-radius:14px; display:grid; place-items:center; color:#7ec2ff; background:rgba(48,121,230,.14); border:1px solid rgba(90,158,255,.14); }
    .modal-icon svg { width:22px; }
    .modal h2 { margin:18px 0 8px; font-size:22px; letter-spacing:-.035em; }
    .modal p { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:23px; }
    .modal-actions.one { grid-template-columns:1fr; }
    .modal .btn-quiet { border:1px solid var(--line); background:rgba(255,255,255,.035); }
    .modal .btn-quiet:hover { background:rgba(255,255,255,.07); }
    .credential-input { width:100%; height:47px; margin-top:18px; padding:0 14px; border:1px solid var(--line); border-radius:13px; outline:none; background:#081321; color:var(--ink); }
    .credential-input:focus { border-color:rgba(73,148,255,.64); box-shadow:0 0 0 4px rgba(61,141,255,.09); }
    .toast-stack { position:fixed; z-index:40; right:21px; bottom:21px; width:min(360px,calc(100% - 42px)); pointer-events:none; }
    .toast { margin-top:9px; padding:14px 15px; border:1px solid rgba(114,164,229,.18); border-radius:14px; background:rgba(13,26,44,.96); box-shadow:0 17px 45px rgba(0,0,0,.4); color:#dbeaff; font-size:12px; line-height:1.5; animation:toastIn .22s ease; }
    .toast.error { border-color:rgba(255,92,122,.25); color:#ffafbd; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } }
    @media (max-width: 820px) { .layout { grid-template-columns:310px 1fr; } .sidebar { padding-left:18px; } .main { padding:24px; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark"><img src="__DOUBLETAKE_ICON__" alt=""></div>
        <div><div class="brand-name">DoubleTake</div><div id="brandSub" class="brand-sub">AirPlay Studio</div></div>
      </div>
      <div class="service-pill"><span class="pulse"></span><span id="serviceText">Discovering receivers</span></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div id="nearbyLabel" class="section-kicker">Nearby</div>
        <div class="section-title">Apple TVs</div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="search" class="search" autocomplete="off" spellcheck="false" placeholder="Filter by name…">
          <button id="clearSearch" class="clear-search" aria-label="Clear search">×</button>
        </div>
        <div class="list-head"><span id="deviceCount">Scanning your network…</span></div>
        <div id="deviceList" class="device-list"></div>
      </aside>
      <main id="main" class="main"></main>
    </div>
  </div>

  <div id="credentialModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
      <h2 id="credentialTitle">Enter pairing code</h2>
      <p id="credentialCopy">Type the code shown on your Apple TV.</p>
      <input id="credentialInput" class="credential-input" type="password" autocomplete="off" placeholder="Pairing code">
      <div class="modal-actions">
        <button id="cancelCredential" class="btn btn-quiet">Cancel</button>
        <button id="sendCredential" class="btn btn-primary">Continue</button>
      </div>
    </div>
  </div>
  <div id="toasts" class="toast-stack"></div>

  <script>
    const locale = '__DOUBLETAKE_LOCALE__';
    const globalFreeze = '__DOUBLETAKE_GLOBAL_FREEZE__' === 'true';
    const translations = {

    };
    const tr = (key, ...args) => {
      const value = (translations[locale] || translations.en)[key];
      return typeof value === 'function' ? value(...args) : value;
    };
    const icons = {
      tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="14" rx="2.5"/><path d="M8 21h8M12 18v3"/></svg>',
      freeze: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4v16M16 4v16"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 5 11 7-11 7z"/></svg>',
      sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a4 4 0 0 1 0 6M19.5 6a8 8 0 0 1 0 12"/></svg>',
      muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 6m0-6-5 6"/></svg>',
      disconnect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M10 5H5v14h5M14 8l4 4-4 4M8 12h10"/></svg>'
    };
    let appState = { status: { streams: [] }, devices: [] };
    let credentialTarget = null;
    let promptedCredentialTarget = null;
    let freezeArmedTarget = null;
    let freezeArmedAction = null;
    let polling = false;
    let armEpoch = 0;
    let lastError = '';
    let lastDeviceRender = '';
    let lastMainRender = '';

    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const streams = () => appState.status?.streams || [];
    const streamFor = ip => streams().find(s => s.device_ip === ip);

    $('brandSub').textContent = tr('brandSub');
    $('serviceText').textContent = tr('discovering');
    $('nearbyLabel').textContent = tr('nearby');
    $('search').placeholder = tr('searchPlaceholder');
    $('clearSearch').setAttribute('aria-label', tr('clearSearch'));
    $('deviceCount').textContent = tr('scanning');
    $('credentialTitle').textContent = tr('enterPairingCode');
    $('credentialCopy').textContent = tr('codeFor', tr('yourAppleTV'));
    $('credentialInput').placeholder = tr('pairingCode');
    $('cancelCredential').textContent = tr('cancel');
    $('sendCredential').textContent = tr('continue');

    function toast(message, isError = false) {
      if (!message) return;
      const el = document.createElement('div');
      el.className = 'toast' + (isError ? ' error' : '');
      el.textContent = message;
      $('toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 3600);
      setTimeout(() => el.remove(), 3900);
    }

    function renderDevices() {
      const query = $('search').value.trim().toLocaleLowerCase();
      const renderKey = JSON.stringify({
        query,
        devices: (appState.devices || []).map(d => ({
          ip: d.ip,
          name: d.name || 'Apple TV',
          model: d.model || tr('receiver')
        })),
        streams: streams().map(s => ({ ip: s.device_ip, state: s.state }))
      });
      if (renderKey === lastDeviceRender) return;
      lastDeviceRender = renderKey;
      const devices = (appState.devices || []).filter(d => d.name.toLocaleLowerCase().includes(query));
      $('clearSearch').style.display = query ? 'block' : 'none';
      $('deviceCount').textContent = query
        ? tr('matches', devices.length)
        : tr('receiversFound', appState.devices?.length || 0);
      if (!devices.length) {
        const scanning = !query && !(appState.devices || []).length;
        $('deviceList').innerHTML = `<div class="empty-list">${scanning ? `<div class="radar"></div>${esc(tr('searching'))}` : esc(tr('noMatch'))}</div>`;
        return;
      }
      $('deviceList').innerHTML = devices.map(d => {
        const active = streamFor(d.ip);
        return `<button class="device ${active ? 'active' : ''}" data-ip="${esc(d.ip)}" ${active ? 'disabled' : ''}>
          <span class="tv-icon">${icons.tv}</span>
          <span><div class="device-name">${esc(d.name || 'Apple TV')}</div><div class="device-meta">${esc(d.model || tr('receiver'))} · ${esc(d.ip)}</div></span>
          ${active ? '<span class="connected-dot"></span>' : '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>'}
        </button>`;
      }).join('');
      document.querySelectorAll('.device:not(:disabled)').forEach(el => el.addEventListener('click', () => chooseDevice(el.dataset.ip)));
    }

    function stateLabel(stream) {
      if (stream.state === 'streaming' && stream.frozen) return [tr('frozen'), 'frozen', '<span class="pulse"></span>'];
      if (stream.state === 'streaming') return [tr('live'), '', '<span class="pulse"></span>'];
      if (stream.state === 'pin_required') return [tr('pairing'), 'connecting', '<span class="spinner"></span>'];
      return [tr('connecting'), 'connecting', '<span class="spinner"></span>'];
    }

    function renderMain() {
      const list = streams();
      const renderKey = JSON.stringify({
        streams: list.map(s => ({
          device: s.device || 'Apple TV',
          device_ip: s.device_ip,
          state: s.state,
          has_audio: s.has_audio,
          audio_muted: s.audio_muted,
          audio_volume: s.audio_volume,
          frozen: s.frozen
        })),
        systemMessage: appState.system_message || '',
        freezeArmedTarget,
        freezeArmedAction
      });
      if (renderKey === lastMainRender) return;
      lastMainRender = renderKey;
      const sys = appState.system_message ? `<div class="system-error">${esc(appState.system_message)}</div>` : '';
      if (!list.length) {
        $('main').innerHTML = `${sys}<div class="welcome"><div class="welcome-inner">
          <div class="orb">${icons.tv}</div>
          ${globalFreeze ? `<div class="shortcut"><kbd>Enter</kbd><span>${esc(tr('shortcut'))}</span></div>` : `<p>${esc(tr('searching'))}</p>`}
        </div></div>`;
        freezeArmedTarget = null;
        freezeArmedAction = null;
        return;
      }
      const banner = freezeArmedTarget ? `<div class="freeze-banner"><span>${esc(tr(freezeArmedAction ? 'armFreeze' : 'armUnfreeze'))}</span><kbd>Enter</kbd><kbd>Esc</kbd></div>` : '';
      const cards = list.map(s => {
        const [label, cls, indicator] = stateLabel(s);
        const ready = s.state === 'streaming';
        const armed = freezeArmedTarget === s.device_ip;
        const freezeText = armed ? tr('pressEnter') : tr(s.frozen ? 'unfreeze' : 'freeze');
        const freezeIcon = s.frozen ? icons.play : icons.freeze;
        const volume = Math.min(100, Math.max(0, Number(s.audio_volume ?? 100)));
        const muted = !!s.audio_muted;
        const audioPanel = s.has_audio ? `<div class="audio-panel">
          <button class="audio-toggle mute-control" data-target="${esc(s.device_ip)}" data-muted="${muted}" aria-label="${esc(tr(muted ? 'unmuteAudio' : 'muteAudio'))}">${muted ? icons.muted : icons.sound}<span>${esc(tr(muted ? 'unmute' : 'mute'))}</span></button>
          <div class="audio-range-wrap"><div class="audio-range-head"><span>${esc(tr(muted ? 'audioMuted' : 'streamVolume'))}</span><strong class="volume-value">${volume}%</strong></div>
          <input class="audio-range" type="range" min="0" max="100" step="1" value="${volume}" data-target="${esc(s.device_ip)}" aria-label="${esc(tr('volumeFor', s.device || 'Apple TV'))}"></div>
        </div>` : '';
        return `<section class="session-card">
          <div class="session-top">
            <div class="session-icon">${icons.tv}</div>
            <div class="session-info"><div class="session-name">${esc(s.device || 'Apple TV')}</div><div class="session-detail">${esc(s.device_ip)}</div></div>
            <div class="state-chip ${cls}">${indicator}<span>${label}</span></div>
          </div>
          <div class="metrics">
            <div class="metric"><strong>Video</strong> · ${esc(tr(s.frozen ? 'heldFrame' : 'liveScreen'))}</div>
            <div class="metric"><strong>Audio</strong> · ${esc(tr(s.has_audio ? (muted ? 'muted' : 'streaming') : 'off'))}</div>
            <div class="metric"><strong>AirPlay</strong> · ${esc(tr('secure'))}</div>
          </div>
          ${audioPanel}
          <div class="controls">
            <button class="btn btn-primary freeze-control ${armed ? 'armed' : ''}" data-target="${esc(s.device_ip)}" data-frozen="${s.frozen}" ${ready ? '' : 'disabled'}>${freezeIcon}<span>${esc(freezeText)}</span></button>
            <button class="btn btn-secondary disconnect-control" data-target="${esc(s.device_ip)}">${icons.disconnect}<span>${esc(tr('disconnect'))}</span></button>
          </div>
        </section>`;
      }).join('');
      $('main').innerHTML = `${sys}<div class="sessions-head"><div><div class="section-kicker">${esc(tr('nowPlaying'))}</div><h1>${esc(tr('activeSessions'))}</h1></div><div class="live-pill"><span class="pulse"></span>${esc(tr('connected', list.length))}</div></div>${banner}${cards}`;
      document.querySelectorAll('.freeze-control').forEach(btn => btn.addEventListener('click', () => freezeClicked(btn.dataset.target, btn.dataset.frozen === 'true')));
      document.querySelectorAll('.disconnect-control').forEach(btn => btn.addEventListener('click', () => disconnect(btn.dataset.target)));
      document.querySelectorAll('.mute-control').forEach(btn => btn.addEventListener('click', () => muteClicked(btn.dataset.target, btn.dataset.muted === 'true')));
      document.querySelectorAll('.audio-range').forEach(slider => {
        slider.addEventListener('input', () => { slider.closest('.audio-panel').querySelector('.volume-value').textContent = `${slider.value}%`; });
        slider.addEventListener('change', () => volumeChanged(slider.dataset.target, Number(slider.value)));
      });
    }

    function render() {
      renderDevices();
      renderMain();
      $('serviceText').textContent = tr(streams().some(s => s.state === 'streaming') ? 'airplayActive' : 'discoveryActive');
      maybePromptCredential();
    }

    async function poll() {
      if (polling) return;
      polling = true;
      const requestArmEpoch = armEpoch;
      try {
        appState = await getAppState();
        const error = appState.status?.error || '';
        if (error && error !== lastError) toast(error, true);
        lastError = error;
        if (freezeArmedTarget && requestArmEpoch === armEpoch) {
          const armedStream = streamFor(freezeArmedTarget);
          if (!armedStream) {
            const oldTarget = freezeArmedTarget;
            freezeArmedTarget = null;
            freezeArmedAction = null;
            void disarmGlobalFreeze(oldTarget);
          } else if (appState.freeze_armed_target !== freezeArmedTarget || appState.freeze_armed_action !== freezeArmedAction) {
            if (armedStream.frozen === freezeArmedAction) toast(tr(armedStream.frozen ? 'frameFrozen' : 'videoResumed'));
            freezeArmedTarget = null;
            freezeArmedAction = null;
          }
        }
        render();
      } catch (err) {
        if (String(err) !== lastError) toast(String(err), true);
        lastError = String(err);
      } finally { polling = false; }
    }

    async function chooseDevice(ip) {
      const device = (appState.devices || []).find(d => d.ip === ip);
      if (!device) return;
      try {
        const response = await connectDevice(device.ip, device.port);
        if (!response.ok) toast(response.error || tr('couldNotConnect'), true);
        else toast(tr('connectingTo', device.name || 'Apple TV'));
      } catch (err) { toast(String(err), true); }
      await poll();
    }

    function maybePromptCredential() {
      const pending = streams().find(s => s.state === 'pin_required');
      if (!pending) {
        promptedCredentialTarget = null;
        if ($('credentialModal').classList.contains('open')) $('credentialModal').classList.remove('open');
        return;
      }
      if (promptedCredentialTarget === pending.device_ip) return;
      promptedCredentialTarget = pending.device_ip;
      credentialTarget = pending.device_ip;
      const password = pending.credential_kind === 'password';
      $('credentialTitle').textContent = tr(password ? 'receiverPassword' : 'enterPairingCode');
      $('credentialCopy').textContent = password ? tr('passwordFor', pending.device || tr('yourReceiver')) : tr('codeFor', pending.device || tr('yourAppleTV'));
      $('credentialInput').placeholder = tr(password ? 'password' : 'pairingCode');
      $('credentialInput').value = '';
      $('credentialModal').classList.add('open');
      setTimeout(() => $('credentialInput').focus(), 80);
    }

    async function sendCredential() {
      const value = $('credentialInput').value.trim();
      if (!value || !credentialTarget) return;
      $('sendCredential').disabled = true;
      try {
        const response = await submitCredential(credentialTarget, value);
        if (!response.ok) { toast(response.error || tr('pairingFailed'), true); return; }
        $('credentialModal').classList.remove('open');
        toast(tr('pairingSent'));
      } catch (err) { toast(String(err), true); }
      finally { $('sendCredential').disabled = false; }
      await poll();
    }

    async function cancelCredential() {
      const target = credentialTarget;
      $('credentialModal').classList.remove('open');
      promptedCredentialTarget = null;
      credentialTarget = null;
      if (target) await disconnect(target);
    }

    async function disconnect(target) {
      if (freezeArmedTarget === target) {
        freezeArmedTarget = null;
        freezeArmedAction = null;
        await disarmGlobalFreeze(target);
      }
      try {
        const response = await disconnectDevice(target);
        if (!response.ok) toast(response.error || tr('couldNotDisconnect'), true);
        else toast(tr('disconnected'));
      } catch (err) { toast(String(err), true); }
      await poll();
    }

    async function freezeClicked(target, frozen) {
      if (!globalFreeze) {
        try {
          const response = await setStreamFrozen(target, !frozen);
          if (!response.ok) toast(response.error || tr('couldNotFreeze'), true);
          else toast(tr(frozen ? 'videoResumed' : 'frameFrozen'));
        } catch (err) { toast(String(err), true); }
        await poll();
        return;
      }
      if (freezeArmedTarget === target) {
        freezeArmedTarget = null;
        freezeArmedAction = null;
        await disarmGlobalFreeze(target);
        renderMain();
        return;
      }
      try {
        await armGlobalFreeze(target, !frozen);
        armEpoch++;
        freezeArmedTarget = target;
        freezeArmedAction = !frozen;
        renderMain();
        toast(tr(frozen ? 'unfreezeArmed' : 'freezeArmed'));
      } catch (err) { toast(String(err), true); }
    }

    async function muteClicked(target, muted) {
      try {
        const response = await setStreamMuted(target, !muted);
        if (!response.ok) toast(response.error || tr('couldNotMute'), true);
        else toast(tr(muted ? 'audioUnmuted' : 'audioMutedToast'));
      } catch (err) { toast(String(err), true); }
      await poll();
    }

    async function volumeChanged(target, volume) {
      try {
        const response = await setStreamVolume(target, volume);
        if (!response.ok) toast(response.error || tr('couldNotChangeVolume'), true);
      } catch (err) { toast(String(err), true); }
      await poll();
    }

    $('search').addEventListener('input', renderDevices);
    $('clearSearch').addEventListener('click', () => { $('search').value = ''; $('search').focus(); renderDevices(); });
    $('sendCredential').addEventListener('click', sendCredential);
    $('cancelCredential').addEventListener('click', cancelCredential);
    $('credentialInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); sendCredential(); } });
    document.addEventListener('keydown', e => {
      if ($('credentialModal').classList.contains('open')) return;
      if (e.key === 'Escape' && freezeArmedTarget) {
        const target = freezeArmedTarget;
        freezeArmedTarget = null;
        freezeArmedAction = null;
        void disarmGlobalFreeze(target);
        renderMain();
      }
    });
    poll();
    setInterval(poll, 850);
  </script>
</body>
</html>
