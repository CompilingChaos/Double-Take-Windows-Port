name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: go test ./...

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build doubletake
        shell: bash
        run: go build -ldflags='-s -w' -o doubletake${{ matrix.exe }} ./cmd/doubletake

      - name: Build doubletake-ctl
        shell: bash
        run: go build -ldflags='-s -w' -o doubletake-ctl${{ matrix.exe }} ./cmd/doubletake-ctl

      - name: Bundle manpages
        if: runner.os == 'Linux'
        run: make manpages-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: |
            doubletake${{ matrix.exe }}
            doubletake-ctl${{ matrix.exe }}
            doubletake-manpages.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          # Re-fetch the tag to ensure the annotated tag object is present
          git fetch origin tag "${GITHUB_REF_NAME}" --force --no-tags
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          files: |
            doubletake
            doubletake-ctl
            doubletake.exe
            doubletake-ctl.exe
            doubletake-manpages.tar.gz
