name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux capture and desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxi-dev xvfb gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
      - name: Test Linux receiver list with runtime libraries
        if: runner.os == 'Linux'
        run: |
          go test -c -tags desktop -o "$RUNNER_TEMP/doubletake-gui.test" ./cmd/doubletake-gui
          sudo apt-get remove -y libwebkit2gtk-4.1-dev
          xvfb-run -a "$RUNNER_TEMP/doubletake-gui.test" -test.v
      - name: Test
        shell: bash
        run: go test ./...

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            exe: ""
          - os: windows-latest
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxi-dev desktop-file-utils

      - name: Build Linux apps and Debian package
        if: runner.os == 'Linux'
        run: |
          version=0.0.0~dev
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          fi
          make deb DEB_VERSION="$version"

      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        shell: bash
        run: go build -ldflags='-s -w -H windowsgui' -o doubletake.exe ./cmd/doubletake-gui

      - name: Build DoubleTake command line app
        if: runner.os == 'Windows'
        shell: bash
        run: go build -ldflags='-s -w' -o doubletake-cli.exe ./cmd/doubletake

      - name: Build doubletake-ctl
        if: runner.os == 'Windows'
        shell: bash
        run: go build -ldflags='-s -w' -o doubletake-ctl${{ matrix.exe }} ./cmd/doubletake-ctl

      - name: Build DoubleTake test receiver
        if: runner.os == 'Windows'
        shell: bash
        run: go build -ldflags='-s -w' -o doubletake-test-receiver${{ matrix.exe }} ./cmd/doubletake-test-receiver

      - name: Bundle manpages
        if: runner.os == 'Linux'
        run: make manpages-release

      - name: Package Linux release
        if: runner.os == 'Linux'
        run: |
          tar -czf doubletake-linux-amd64.tar.gz -C bin \
            doubletake-gui doubletake doubletake-ctl doubletake-test-receiver \
            -C "$GITHUB_WORKSPACE" doubletake-manpages.tar.gz
          mv artifacts/doubletake-linux-amd64.deb .

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: release-assets-linux
          path: |
            doubletake-linux-amd64.deb
            doubletake-linux-amd64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: release-assets-windows
          path: |
            doubletake.exe
            doubletake-cli.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          # Re-fetch the tag to ensure the annotated tag object is present
          git fetch origin tag "${GITHUB_REF_NAME}" --force --no-tags
          NOTES=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --format='%B' "${GITHUB_REF_NAME}")
          fi
          {
            echo 'RELEASE_NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: DoubleTake ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.RELEASE_NOTES }}
          files: |
            doubletake-linux-amd64.deb
            doubletake-linux-amd64.tar.gz
            doubletake.exe
            doubletake-cli.exe
